name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop-os/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop-os
        run: npm ci

      - name: Run Prettier check
        working-directory: apps/desktop-os
        run: npx prettier --check "src/**/*.{ts,tsx}" --config .prettierrc || echo "Prettier check completed"
        continue-on-error: true

      - name: Run ESLint
        working-directory: apps/desktop-os
        run: npm run lint

      - name: Run TypeScript type checking
        working-directory: apps/desktop-os
        run: npm run typecheck

      - name: Run tests
        working-directory: apps/desktop-os
        run: npm test

      - name: Check test coverage
        working-directory: apps/desktop-os
        run: |
          npm run test:coverage || true
          echo "Coverage report generated"

      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## Code Quality Report')
            );
            
            const output = `## Code Quality Report
            
            ### Test Results
            ${process.env.TEST_RESULT === 'success' ? '✅ Tests passing' : '❌ Tests failed'}
            
            ### Lint Results
            ${process.env.LINT_RESULT === 'success' ? '✅ Linting passed' : '❌ Linting failed'}
            
            ### Type Check
            ${process.env.TYPE_RESULT === 'success' ? '✅ TypeScript check passed' : '❌ TypeScript check failed'}
            
            ---
            *This comment was automatically generated by the Code Quality workflow*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
        env:
          TEST_RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
          LINT_RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
          TYPE_RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
